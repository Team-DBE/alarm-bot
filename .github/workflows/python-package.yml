name: 디스코드 회의 알림봇

on:
  schedule:
    # 매주 일요일, 수요일 오후 4시 (KST / UTC+9)
    - cron: "0 7 * * 0,3"
  workflow_dispatch:

jobs:
  message:
    runs-on: ubuntu-latest
    steps:
    - name: Discord Webhook Action
      uses: tsickert/discord-webhook@v5.3.0
      with:
        webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
        content: |-
            # 공지
            <@&1360967100067483658>
            내일 회의 진행합니다
            일시 : 내일 아침 10시 ~

            참여 여부 이모지로 남겨주세요
