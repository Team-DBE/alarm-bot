name: 디스코드 회의 알림봇

on:
  schedule: # UTC+9 기준 월요일 1시 실행
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  message:
    runs-on: ubuntu-latest
    steps:
    - name: Discord Webhook Action
      uses: tsickert/discord-webhook@v5.3.0
      with:
        webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
        content: |-
            # 공지
            <@&1360967100067483658>
            오늘 회의 진행합니다
            일시 : 오늘 10시~
            장소 : 다과실

            참여 여부 이모지로 남겨주세요
